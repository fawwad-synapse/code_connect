services:
  db:
    #sad
    image: postgis/postgis:16-3.4
    container_name: rescuerank-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rescuerank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rescuerank_db}
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rescuerank} -d ${POSTGRES_DB:-rescuerank_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rescuerank-prod-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-rescuerank}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rescuerank_db}
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-mistral}
      LLM_MODEL: ${LLM_MODEL:-mistral-small-latest}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      ALERT_WHATSAPP_NUMBERS: ${ALERT_WHATSAPP_NUMBERS}
      CORS_ORIGINS: '["https://${DOMAIN:-localhost}", "http://localhost"]'
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN:-localhost}
    container_name: rescuerank-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {if (r.statusCode !== 200) process.exit(1);})"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M

  proxy:
    image: caddy:2-alpine
    container_name: rescuerank-prod-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - internal-net

volumes:
  prod_pgdata:
    name: rescuerank_prod_pgdata
  caddy_data:
    name: rescuerank_caddy_data
  caddy_config:
    name: rescuerank_caddy_config

networks:
  internal-net:
    name: rescuerank_prod_net
