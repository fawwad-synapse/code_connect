# RescueRank Scoring Configuration
vulnerability_weights:
  age_factor: 0.25
  lives_alone: 0.15
  mobility_impaired: 0.20
  chronic_medical_need: 0.20
  housing_fragility: 0.10
  zone_deprivation: 0.10

warning_gap_weights:
  has_smartphone: 0.40
  signal_quality: 0.30
  alert_acknowledged: 0.30

priority_formula_constants:
  vulnerability_base: 0.30
  vulnerability_slope: 0.70
  warning_gap_multiplier: 0.50
  warning_gap_divisor: 1.50
  urgency_base: 0.50
  urgency_slope: 0.50
  urgency_max_hours: 12.0
  urgency_min_clamp: 0.10

uncertainty_penalties:
  missing_field_penalty: 0.15
  stale_report_hours: 3.0
  stale_penalty: 0.20
  unverified_report_penalty: 0.15
  fallback_hazard_penalty: 0.20
  silent_zone_risk_floor: 0.65
  silent_zone_priority_uplift: 15.0

# Crowd-report policy. Scores use a capped evidence uplift, not a database forecast mutation.
report_evidence:
  household_radius_m: 750
  score_uplift_per_weight: 3.0
  max_score_uplift: 15.0
  max_household_weight: 5.0
  late_after_hours: 6.0
  late_report_weight: 0.35
  conflicting_report_weight: 0.25
  conflict_depth_difference_m: 0.5
  conflict_resolution: "Higher effective confidence wins; ties go to the newer report. Record the conflict on both reports."

what_if:
  flood_level_max_depth_m: 2.5
