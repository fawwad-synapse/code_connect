[project]
name = "rescuerank-backend"
version = "0.1.0"
description = "RescueRank: Explainable Disaster Response & Vulnerable Population Prioritization System"
authors = [{ name = "RescueRank Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "greenlet>=3.0.0",
    "sqlalchemy>=2.0.28",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.14.7",
    "alembic>=1.13.1",
    "shapely>=2.0.3",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "ortools>=9.9.3963",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-mistralai>=0.1.0",
    "langchain-groq>=0.1.0",
    "langchain-openai>=0.1.0",
    "apscheduler>=3.10.4",
    "rapidfuzz>=3.7.0",
    "sentence-transformers>=2.6.0",
    "numpy>=1.26.4",
    "pandas>=2.2.1",
    "faker>=24.3.0",
    "python-telegram-bot>=21.0.1",
    "structlog>=24.1.0",
    "slowapi>=0.1.9",
    "pyjwt>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "pyyaml>=6.0.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
